name: Build

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  build:
    name: Build and Validate
    runs-on: windows-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive

      - name: Setup Visual Studio environment
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          # Task runner only - pixi.toml declares no packages, and setup-pixi's
          # `pixi list --locked` step errors on an empty environment.
          run-install: false

      - name: Build and package
        shell: pwsh
        run: |
          pixi run package
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::pixi run package failed"; exit 1 }

      - name: Verify installer was produced
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/*-installer.zip | Select-Object -First 1
          if (-not $zip) { Write-Host "::error::No installer ZIP found in release/"; exit 1 }
