; Control: Ultimate Edition Head Tracking - configuration
; Hotkey values are Win32 Virtual Key codes (decimal).

[Network]
UdpPort=4242

[General]
EnableOnStartup=1
PositionEnabled=1
; Yaw mode: true = horizon-locked yaw (default), false = camera-local.
WorldSpaceYaw=1

[Camera]
; Field of view. Control has its own FOV Scale slider under Options >
; Graphics, but the game clamps that slider to 0.75-1.25. This is the
; same multiplier, written past the clamp and re-applied every frame so
; changing a graphics option cannot quietly undo it.
; 0 leaves Control's own slider in charge. Otherwise 0.5-2.0.
; It scales the tangent of the half-angle, so from Control's default 70
; degrees horizontal: 1.25 gives 82, 1.5 gives 93, 2.0 gives 109.
; Aim zoom still works, and cutscenes keep their authored framing - the
; game fades the multiplier out whenever it owns the camera.
FovScale=0

[Rotation]
YawSensitivity=1
PitchSensitivity=1
RollSensitivity=1
InvertYaw=0
InvertPitch=0
InvertRoll=0
; Smoothing covers rotation and position alike. Which of the two is used
; is picked per connection from the packet's source address: LOOPBACK only
; counts as local, so a tracker on this PC sending to this machine's LAN
; address is treated as remote. 0 responsive, 1 heavy. Nothing floors
; either value; 0 is the lightest setting, a 20ms time constant.
LocalSmoothing=0
RemoteSmoothing=0.15
YawDeadzone=0
PitchDeadzone=0
RollDeadzone=0

[Position]
SensitivityX=1
SensitivityY=1
SensitivityZ=1
LimitX=0.3
LimitY=0.2
LimitZ=0.4
LimitZBack=0.1

[Hotkeys]
; Defaults: End=Toggle, PgUp=TogglePosition, PgDn=ToggleYawMode.
Toggle=35
TogglePosition=33
ToggleYawMode=34
